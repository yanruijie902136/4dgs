[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourdgs"
version = "0.1.0"
description = "Modular 4D Gaussian Splatting for dynamic scene reconstruction"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.7,<2.8", "torchvision>=0.22,<0.23", "numpy>=1.26,<2",
  "Pillow>=10", "hydra-core==1.3.2", "omegaconf==2.3.0", "plyfile>=1.0,<1.1.3",
  "tqdm>=4.66", "imageio[ffmpeg]>=2.34", "pytorch-msssim==1.0.0",
]

[project.optional-dependencies]
preprocess = ["opencv-python-headless>=4.8,<4.12", "open3d==0.19.0"]
visualization = ["matplotlib>=3.8", "tensorboard>=2.16"]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "types-PyYAML", "build"]

[project.scripts]
"4dgs" = "fourdgs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fourdgs = ["configs/**/*.yaml", "configs/*.yaml", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires compiled CUDA extensions and a GPU", "integration: requires external data"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/fourdgs"]
