# @package _global_
model:
  net_width: 128
  kplanes_config:
    output_coordinate_dim: 16
    resolution:
    - 64
    - 64
    - 64
    - 150
  multires:
  - 1
  - 2
  - 4
data:
  format: hypernerf
  cache_size: 256
training:
  render_process: true
  iterations: 60000
  batch_size: 2
loss:
  plane_tv_weight: 0.0002
  time_smoothness_weight: 0.001
density:
  opacity_reset_interval: 300000
  densify_until_iter: 10000
