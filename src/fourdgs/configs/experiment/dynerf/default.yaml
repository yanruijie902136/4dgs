# @package _global_
model:
  net_width: 128
  defor_depth: 0
  kplanes_config:
    output_coordinate_dim: 16
    resolution:
    - 64
    - 64
    - 64
    - 150
  multires:
  - 1
  - 2
  no_do: false
  no_dshs: false
data:
  format: neu3d
